<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Electronics in Lusaka | Cyber-IT Electronics</title>
<meta name="description" content="Browse the Cyber-IT Electronics catalogue — smartphones, laptops, tablets, TVs, audio and accessories in Lusaka. Search, filter, and order via WhatsApp.">
<link rel="icon" href="assets/logo/cyberit-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<div id="site-navbar"></div>

<main>
  <section class="page-hero">
    <div class="container">
      <p class="breadcrumb"><a href="index.html">Home</a> / Shop</p>
      <h1>Shop the Full Catalogue</h1>
      <p>Search by name, filter by category, and order directly through WhatsApp — no account or checkout needed.</p>
    </div>
  </section>

  <section class="section--tight">
    <div class="container">

      <div class="shop-toolbar">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Search products…" aria-label="Search products">
        </div>
        <select id="sortSelect" class="sort-select" aria-label="Sort products">
          <option value="featured">Sort: Featured</option>
          <option value="price-low">Price: Low to High</option>
          <option value="price-high">Price: High to Low</option>
          <option value="deals">Deals Only</option>
        </select>
      </div>

      <div class="filter-chips" id="categoryChips" style="margin-bottom:32px;"></div>

      <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:18px;" id="resultCount"></p>

      <div class="product-grid" id="shopGrid"></div>

    </div>
  </section>

  <section class="disclaimer-strip">
    Demo website concept. Product prices, availability and catalogue information should be confirmed with Cyber-IT Electronics.
  </section>
</main>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/site.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
